---
layout: default
title: Writings
---
<div class="page">
  <h1>Writings</h1>
  {% if site.posts.size > 0 %}
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %b %Y" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Nothing published yet.</p>
  {% endif %}
</div>

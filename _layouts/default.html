<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} – {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}" type="image/svg+xml">
  <script src="{{ '/assets/typed.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav aria-label="Sections">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/writings/' | relative_url }}"{% if page.url == '/writings/' %} aria-current="page"{% elsif page.layout == 'post' %} aria-current="true"{% endif %}>Writings</a>
      <a href="{{ '/others/' | relative_url }}"{% if page.url == '/others/' %} aria-current="page"{% endif %}>Others</a>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="site-footer">
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </footer>
</body>
</html>
